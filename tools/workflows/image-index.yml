name: Build gallery artifacts

# 두 가지를 자동으로 만든다.
#   Images/ 가 바뀌면      -> index.json 과 480px 썸네일
#   플러그인이 바뀌면      -> plugins/dist/ 의 zip 과 version.json (헤더 Version이 올랐을 때만)
# 태그도 릴리스도 쓰지 않는다. 버전만 올려서 push하면 워드프레스에 업데이트가 뜬다.

on:
  push:
    branches: [main]
    paths:
      - 'Images/**'
      - '!Images/index.json'
      - '!Images/.thumbs/**'
      - 'plugins/github-image-gallery/**'
      - 'tools/build_image_index.py'
      - 'tools/build_plugin_dist.sh'
      - 'tools/build_plugin_dist.py'
      - '.github/workflows/image-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-artifacts
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # commit 날짜를 git log로 읽으므로 전체 이력이 필요하다

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install --quiet 'pillow>=10'

      - name: Build the image index and thumbnails
        run: python3 tools/build_image_index.py

      - name: Build the plugin zip when the version changed
        run: bash tools/build_plugin_dist.sh

      - name: Commit whatever changed
        run: |
          if git diff --quiet -- Images/index.json Images/.thumbs plugins/dist; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Images/index.json Images/.thumbs plugins/dist
          git commit -m 'Rebuild gallery artifacts'
          git push
