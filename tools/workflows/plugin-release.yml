name: Package plugin

# plugin-v1.0.1 처럼 tag를 밀면 plugins/github-image-gallery/ 만 담은 zip을 만들어
# release에 붙인다. 워드프레스의 업데이트 화면은 이 asset을 내려받는다.
#
#   git tag plugin-v1.0.1 && git push origin plugin-v1.0.1

on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'plugin-v로 시작하는 tag 이름'
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the plugin header
        run: |
          TAG="${GITHUB_REF_NAME#plugin-v}"
          HDR=$(grep -m1 '^ \* Version:' plugins/github-image-gallery/github-image-gallery.php \
                | sed 's/.*Version: *//' | tr -d '[:space:]')
          echo "tag=$TAG header=$HDR"
          if [ "$TAG" != "$HDR" ]; then
            echo "::error::tag ($TAG) and the plugin header ($HDR) disagree"
            exit 1
          fi

      - name: Build the zip
        run: |
          mkdir -p build
          cp -r plugins/github-image-gallery build/github-image-gallery
          cd build && zip -rq github-image-gallery.zip github-image-gallery
          unzip -l github-image-gallery.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/github-image-gallery.zip
          generate_release_notes: true
