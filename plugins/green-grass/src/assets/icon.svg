<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Green Grass">
	<!--
		Drawn at 20px in the admin menu, so each square lands on about four pixels.
		Everything here is in service of that: four columns rather than a real
		calendar's fifty-three, one pixel of gap so the squares stay separate at
		that size, and a corner radius small enough to survive the downscale.

		The shades run light at the top left and dark at the bottom right. A
		random scatter turns to mush when it is this small; a direction still
		reads, and it says the same thing the calendar says, that the squares
		mean more and less of something.

		The five greens are the ones the calendar itself draws with, so the menu
		and the page agree. Served as a URL, never as a data URI: the admin's
		svg-painter.js repaints base64 menu icons in one flat colour, which would
		leave this as a single grey block.
	-->
	<rect x="0.5" y="0.5" width="5" height="5" rx="1.2" fill="#9be9a8"/>
	<rect x="6.5" y="0.5" width="5" height="5" rx="1.2" fill="#c6e9d0"/>
	<rect x="12.5" y="0.5" width="5" height="5" rx="1.2" fill="#40c463"/>
	<rect x="18.5" y="0.5" width="5" height="5" rx="1.2" fill="#9be9a8"/>
	<rect x="0.5" y="6.5" width="5" height="5" rx="1.2" fill="#c6e9d0"/>
	<rect x="6.5" y="6.5" width="5" height="5" rx="1.2" fill="#40c463"/>
	<rect x="12.5" y="6.5" width="5" height="5" rx="1.2" fill="#9be9a8"/>
	<rect x="18.5" y="6.5" width="5" height="5" rx="1.2" fill="#30a14e"/>
	<rect x="0.5" y="12.5" width="5" height="5" rx="1.2" fill="#40c463"/>
	<rect x="6.5" y="12.5" width="5" height="5" rx="1.2" fill="#9be9a8"/>
	<rect x="12.5" y="12.5" width="5" height="5" rx="1.2" fill="#30a14e"/>
	<rect x="18.5" y="12.5" width="5" height="5" rx="1.2" fill="#40c463"/>
	<rect x="0.5" y="18.5" width="5" height="5" rx="1.2" fill="#9be9a8"/>
	<rect x="6.5" y="18.5" width="5" height="5" rx="1.2" fill="#30a14e"/>
	<rect x="12.5" y="18.5" width="5" height="5" rx="1.2" fill="#40c463"/>
	<rect x="18.5" y="18.5" width="5" height="5" rx="1.2" fill="#216e39"/>
</svg>
